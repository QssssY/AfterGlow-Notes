# 余晖录 · push 即构建发布，服务器定时自取（晚高峰跨境拥塞版）
#
# 为什么不是 CI 直连服务器部署：runner 在海外、服务器在北京，22 端口
# 的 SSH 数据传输在跨境晚高峰会被拥塞拖死（连接能建立、认证能过、
# 传输爬不动），重试多少次都白搭 —— 物理链路问题，不是代码问题。
#
# 三条互补的部署路：
#   1. CI（本文件）：构建 → 产物发布到 GitHub Release（tag 固定 deploy，
#      产物覆盖）。runner→GitHub 同侧网络，永远秒绿；
#   2. 服务器：systemd timer 每 5 分钟跑 /opt/afterglow/pull-deploy.sh，
#      发现 Release 变了就下载换装 —— 链路空闲时几分钟内落地，拥塞时
#      挂着下一轮重试，永不报错刷存在感；
#   3. 本机：bash scripts/deploy.sh（国内线路直连，30 秒）—— 着急上线
#      或加歌（音乐不进仓库，只有这条路能送）时用。
# 前提：仓库 Secrets 的 DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS 已不需要，
#      本流程零 SSH。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write # 往 Release 写产物

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # 版本读 package.json 的 packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（同源自托管形态）
        run: PUBLIC_API_BASE=same-origin pnpm run build

      - name: 打包 dist 与仓库快照
        run: |
          tar -C dist --exclude='./music' -czf /tmp/dist.tgz .
          git ls-files -z | tar --null -T - -czf /tmp/blog.tgz

      - name: 发布到 Release（tag 固定 deploy，产物覆盖）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          gh release delete deploy --yes --cleanup-tag 2>/dev/null || true
          gh release create deploy /tmp/dist.tgz /tmp/blog.tgz \
            --title "自动部署产物 ${SHA}" \
            --notes "服务器 pull-deploy 定时器自取；本机秒发用 bash scripts/deploy.sh" \
            --prerelease
          echo "✓ 产物已发布，服务器将在下一个 5 分钟窗口自取"

      - name: 提示部署链路
        run: |
          echo "==> 部署状态看服务器：journalctl -u afterglow-pull -n 20"
          echo "==> 着急上线：本机 bash scripts/deploy.sh（国内线路 30 秒）"
