# 余晖录 · push 即上线
#
# 触发：push 到 main（或手动 workflow_dispatch）。
# 做什么：与 scripts/deploy.sh 同一套流程的 CI 版 —— pnpm 构建 → 上传 dist 与
#         仓库快照 → 服务器原子换目录 → 重启 afterglow → 公网体检。
# 差别：歌曲不随 CI 走（版权物不进仓库），新增/替换音乐仍在本机跑
#         bash scripts/deploy.sh，它只增量补服务器缺的文件。
# 前提：仓库 Secrets 里有 DEPLOY_SSH_KEY（专用部署私钥，公钥在服务器
#         authorized_keys，注释 afterglow-ci-deploy）与 DEPLOY_KNOWN_HOSTS。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 连续 push 时只保最后一笔，避免排队重部署
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 全量安装 + 构建实测过 14 分钟，15 会误杀慢 run
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # 版本读 package.json 的 packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（同源自托管形态）
        run: PUBLIC_API_BASE=same-origin pnpm run build

      - name: 打包 dist 与仓库快照
        run: |
          tar -C dist --exclude='./music' -czf /tmp/dist.tgz .
          git ls-files -z | tar --null -T - -czf /tmp/blog.tgz

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: 上传 + 原子替换 + 重启（单连接 + 硬超时 + 高重试）
        env:
          HOST: root@106.12.72.232
          ROOT: /opt/afterglow
        run: |
          # 服务器 22 端口被全网爆破扫描，百度云安全代理对外国机房 IP 随机
          # 丢包 —— runner 单条连接成功率只有两三成。对策：① 全部走一条
          # ssh 连接（两个 tar 拼流从 stdin 过去，远端按字节切开后自己换
          # 目录重启），不搞 scp+ssh 两连击；② timeout 硬掐单次挂死；
          # ③ 8 次重试兜概率。
          BLOG_SIZE=$(stat -c%s /tmp/blog.tgz)
          for i in 1 2 3 4 5 6 7 8; do
            if cat /tmp/blog.tgz /tmp/dist.tgz | timeout 150 ssh "$HOST" "set -e
              head -c $BLOG_SIZE > /tmp/blog.tgz
              tail -c +$((BLOG_SIZE + 1)) > /tmp/dist.tgz
              mkdir -p $ROOT/blog && tar -xzf /tmp/blog.tgz -C $ROOT/blog
              rm -rf $ROOT/dist.new && mkdir -p $ROOT/dist.new
              tar -xzf /tmp/dist.tgz -C $ROOT/dist.new
              rm -rf $ROOT/dist.prev
              if [ -d $ROOT/dist ]; then mv $ROOT/dist $ROOT/dist.prev; fi
              mv $ROOT/dist.new $ROOT/dist
              systemctl restart afterglow
              rm -f /tmp/dist.tgz /tmp/blog.tgz"; then
              echo "第 $i 次尝试成功"
              exit 0
            fi
            echo "第 $i 次被云安全丢包掐断，6s 后重试"
            sleep 6
          done
          echo '❌ 八次都失败：大概率百度云安全在拦截，去控制台「云安全→主机安全」看一眼'
          exit 1

      - name: 公网体检
        run: |
          sleep 8   # 服务启动要预载静态文件，给足窗口
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 8 http://106.12.72.232/ || true)
            [ "$code" = 200 ] && break
            sleep 5
          done
          echo "GET / → $code"
          [ "$code" = 200 ] || { echo '❌ 首页不通：查服务器 journalctl -u afterglow -n 50'; exit 1; }
